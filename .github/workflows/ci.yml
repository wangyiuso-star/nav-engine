name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 同一分支的新推送取消上一轮未完成的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  build-and-test:
    name: build + tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc · Release
            os: ubuntu-latest
          - name: apple-clang · Release
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      # 端到端：在确定性合成网格上跑四种算法，nav_cli 在距离不一致或路径校验失败时返回非 0
      - name: End-to-end run on a synthetic grid
        run: |
          python3 tools/gen_grid.py 120 120 0.2 /tmp/grid.txt
          ./build/nav_cli /tmp/grid.txt | tee /tmp/e2e.log
          test "$(grep -c '✓' /tmp/e2e.log)" -eq 3

  sanitizers:
    name: ASan + UBSan · Debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build-asan
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"

      - name: Build
        run: cmake --build build-asan --parallel

      - name: Unit tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure

      - name: CLI under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: |
          python3 tools/gen_grid.py 120 120 0.2 /tmp/grid.txt
          ./build-asan/nav_cli /tmp/grid.txt

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 固定版本，避免 runner 镜像升级带来的格式漂移
      - name: Install clang-format 18.1.3
        run: python3 -m pip install --user --break-system-packages clang-format==18.1.3

      - name: Check formatting
        run: |
          ~/.local/bin/clang-format --version
          ~/.local/bin/clang-format --dry-run --Werror \
            src/*.cpp include/nav/*.hpp app/main.cpp tests/*.cpp tests/*.hpp
